<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>CeroKm</title>
<link rel="apple-touch-icon" href="icono-180.png?v=6">
<link rel="icon" type="image/png" href="favicon.png?v=6">
<link rel="manifest" href="manifest.webmanifest?v=6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CeroKm">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1014">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
         background: #0e1014; color: #eceef2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; text-align: center; }
  .caja { max-width: 360px; width: 100%; }
  .logo { width: min(230px, 62vw); margin: 0 auto; filter: drop-shadow(0 6px 26px rgba(225,29,72,.55)); }
  .logo img { display: block; height: auto; margin: 0 auto; }
  .logo { animation: aparece .4s ease .9s both; }   /* solo se ve si la app tarda: la animación de los logos la hace la app */
  .logo .jr { width: 100%; margin-bottom: 9%; }
  .logo .rs { width: 90.7%; }
  @keyframes aparece { from { opacity: 0; } to { opacity: 1; } }
  #cargando { animation: aparece .4s ease .9s both; }
  html.claro body { background: #f4f5f7; color: #14171c; }
  html.claro .logo img { filter: invert(1); }
  html.claro .logo { filter: drop-shadow(0 6px 20px rgba(225,29,72,.28)); }
  html.claro .barra { background: #e3e6eb; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.4) rotate(-12deg); } 70% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes latido { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes entra { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  h1 { font-size: 12.5px; font-weight: 600; letter-spacing: .42em; text-transform: uppercase; color: #8b93a1; margin: 20px 0 6px; animation: aparece .4s ease .9s both; }
  p { color: #8b93a1; font-size: 14px; line-height: 1.5; margin: 6px 0; }
  .barra { width: 120px; height: 3px; border-radius: 3px; background: #262b34; margin: 22px auto 0; overflow: hidden; }
  .barra::after { content: ""; display: block; width: 40%; height: 100%; background: #e11d48; border-radius: 3px; animation: va 1s ease-in-out infinite; }
  @keyframes va { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  #form { display: none; animation: entra .4s ease both; }
  input { width: 100%; font-size: 16px; padding: 13px 14px; border-radius: 14px; border: 1px solid #262b34; background: #171a20; color: #eceef2; margin-top: 18px; }
  button, a.btn { display: block; width: 100%; margin-top: 12px; padding: 14px; border-radius: 14px; border: 0; background: #e11d48; color: #fff;
                  font-weight: 750; font-size: 16px; text-decoration: none; font-family: inherit; }
  a.btn.sec { background: #1e222a; border: 1px solid #262b34; font-weight: 650; font-size: 14.5px; }
  #err { color: #fca5a5; min-height: 1.4em; }
  /* Sin pantallazos: mientras carga solo se ve el fondo; la animación de logos la hace la app */
  html { background: #0e1014; } html.claro { background: #f4f5f7; }
  body:not(.form) .logo, body:not(.form) h1 { visibility: hidden; }
  #cargando { animation: aparece .4s ease 2.5s both; }
</style>
<script>(function(){var e='';try{e=JSON.parse(localStorage.getItem('tema'))||''}catch(x){}var h=new Date().getHours();if((e||(h>=7&&h<20?'claro':'oscuro'))==='claro')document.documentElement.classList.add('claro')})()</script>
</head>
<body>
<div class="caja">
  <div class="logo"><img class="jr" src="jeepram.png" alt="Jeep RAM"><img class="rs" src="resasco_txt.png" alt="Resasco"></div>
  <h1>Entregas</h1>
  <div id="cargando"><div class="barra"></div></div>
  <div id="form">
    <p>Poné tu código personal (o pegá el código largo que te llegó por mail).</p>
    <input id="cod" placeholder="Código personal" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="entrar">Entrar</button>
    <p id="err"></p>
    <a class="btn sec" id="vieja" href="#">Entrar con mi cuenta de Google (como antes)</a>
  </div>
</div>
<script>
/* La pantalla de la app vive en Google (Apps Script) pero se muestra acá, sin el cartel de Google.
   Google queda solo como motor: cada pedido viaja con la clave secreta guardada en este aparato. */
var WRAP_VER = '10';
var API_ID = 'AKfycbwMccMP6rNIBN-iutoZVSfVqYasFBMve_L3eUG1JDRx5FhUtV1idSD72ImTmHms3ooa2w';
var VIEJA = 'https://script.google.com/macros/s/AKfycbzn7PJlJKF0K5es5lEZd-x_ii8fZ2XYfdUVibRvcqHDJzjdB6Ra9vowjKOc5-fPcKxKGw/exec';
var esPC = window.innerWidth >= 1000 && !/Android|iPhone|iPad/i.test(navigator.userAgent);
document.getElementById('vieja').href = VIEJA + '?vista=' + (esPC ? 'pc' : 'cel');

function leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function parsear(c) { c = String(c || '').trim().replace(/^.*#c=/, ''); var p = c.split('.'); return p.length === 2 && p[0].length > 20 && p[1].length > 20 ? { u: p[0], k: p[1] } : null; }

// Lo que corre DENTRO de la app: reemplaza google.script.run por pedidos a la API
function puente() {
  var A = window.__API, URL = 'https://script.google.com/macros/s/' + A.u + '/exec';
  function llamar(fn, args) {
    return fetch(URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args, k: A.k }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) { if (j.e === 'Clave incorrecta') { try { localStorage.removeItem('cfgApi'); } catch (e) {} location.reload(); } throw new Error(j.e); }
        return j.r;
      });
  }
  function corredor(ok, mal) {
    return new Proxy({}, { get: function (_, fn) {
      if (fn === 'withSuccessHandler') return function (f) { return corredor(f, mal); };
      if (fn === 'withFailureHandler') return function (f) { return corredor(ok, f); };
      if (fn === 'withUserObject') return function () { return corredor(ok, mal); };
      return function () {
        var args = Array.prototype.slice.call(arguments);
        llamar(fn, args).then(function (r) { if (ok) ok(r); }, function (e) {
          if (mal) mal(e.message ? e : new Error('Sin conexión')); else console.error(e); });
      };
    } });
  }
  var q = {}; new URLSearchParams(location.search).forEach(function (v, k) { q[k] = v; });
  window.google = { script: { run: corredor(), host: { close: function () {} },
    url: { getLocation: function (cb) { cb({ parameter: q, parameters: {}, hash: '' }); } } } };
  // Busca versión nueva: a los 4 segundos, cada 10 minutos y al volver a la app. Si hay, la guarda y avisa "Actualización disponible".
  function huella(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return String(h) + ':' + s.length; }
  var ultima = 0;
  // Versión nueva: tapa toda la pantalla y no deja seguir hasta tocar "Actualizar ahora"
  function bloquear() {
    if (document.getElementById('__upd') || !document.body) return;
    var o = document.createElement('div'); o.id = '__upd';
    o.setAttribute('style', 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;' +
      'background:rgba(10,12,16,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-family:-apple-system,system-ui,sans-serif;' +
      'opacity:0;transition:opacity .3s');
    o.innerHTML = '<div style="max-width:340px;width:100%;text-align:center;color:#fff;background:#14171c;border:1px solid rgba(225,29,72,.5);' +
      'border-radius:24px;padding:28px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5)">' +
      '<div style="font-size:44px;line-height:1">✨</div>' +
      '<div style="font-size:20px;font-weight:800;margin:12px 0 6px">Hay una versión nueva</div>' +
      '<div style="font-size:14.5px;color:#a3aab6;line-height:1.5">Para seguir usando la app tenés que actualizar. Tarda unos segundos.</div>' +
      '<button style="display:block;width:100%;margin-top:20px;padding:15px;border:0;border-radius:16px;background:#e11d48;color:#fff;' +
      'font:800 16px -apple-system,system-ui,sans-serif;cursor:pointer">Actualizar ahora</button></div>';
    o.querySelector('button').onclick = function () {
      this.textContent = 'Actualizando…'; this.disabled = true;
      location.replace(location.pathname + '?' + (location.search.indexOf('abrir') >= 0 ? 'abrir=1&' : '') + 'u=' + Date.now());
    };
    document.body.appendChild(o);
    requestAnimationFrame(function () { o.style.opacity = '1'; });
    try { document.activeElement && document.activeElement.blur(); } catch (e) {}
  }
  // ¿Cambió esta página de GitHub? (WRAP_VER es el número de versión escrito en la página)
  function paginaNueva() {
    return fetch(location.pathname + '?nv=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); })
      .then(function (t) { var m = t.match(/var WRAP_VER = '([^']+)'/); if (!m || !window.__WRAP || m[1] === window.__WRAP) return false;
        try { if (sessionStorage.getItem('updWrap') === m[1]) return false; sessionStorage.setItem('updWrap', m[1]); } catch (e) {}   // si ya se intentó, no trabo de nuevo
        return true; }, function () { return false; });
  }
  function conHtml(h, v) {
    if (!h) return;
    try { localStorage.setItem('appHtml', h); if (v) localStorage.setItem('appVer', v); } catch (e) {}
    if (window.__VER && huella(h) !== window.__VER) { var hv = huella(h); try { if (sessionStorage.getItem('updHtml') === hv) return; sessionStorage.setItem('updHtml', hv); } catch (e) {} bloquear(); }
  }
  function revisar() {
    if (Date.now() - ultima < 30000) return; ultima = Date.now();
    // Primero pide solo la huella (unos bytes); la pantalla entera (~350 KB) se baja únicamente si hay versión nueva
    llamar('_ver', []).then(function (v) {
      var ant = null; try { ant = localStorage.getItem('appVer'); } catch (e) {}
      if (v && ant === v) return;
      return llamar('_html', []).then(function (h) { conHtml(h, v); });
    }, function () { return llamar('_html', []).then(function (h) { conHtml(h, ''); }); }).catch(function () {});
    paginaNueva().then(function (n) { if (n) bloquear(); });
  }
  setTimeout(revisar, 3000);
  setInterval(revisar, 5 * 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) revisar(); });

  // Ícono nuevo: el teléfono no deja cambiarlo desde la página, así que se explica cómo volver a agregarlo (una vez por aparato)
  (function () {
    var ICONO = '6', NOMBRE = 'CeroKm', CODIGO = true;
    function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
    var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1), andr = /Android/i.test(ua);
    var inst = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
    var apk = String(document.referrer || '').indexOf('android-app://') === 0;
    var link = location.origin + location.pathname, aviso = null;
    var css = 'position:fixed;inset:0;z-index:2147483646;display:flex;align-items:flex-end;justify-content:center;padding:16px;background:rgba(10,12,16,.7);font-family:-apple-system,system-ui,sans-serif';
    var caja = 'max-width:380px;width:100%;color:#fff;background:#14171c;border:1px solid rgba(225,29,72,.45);border-radius:24px;padding:22px 20px calc(18px + env(safe-area-inset-bottom));box-shadow:0 20px 60px rgba(0,0,0,.5)';
    var btn = 'display:block;width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;font:700 15px -apple-system,system-ui,sans-serif;cursor:pointer;';
    function cerrar(fin) { if (fin) ls('iconoVisto', ICONO); try { sessionStorage.setItem('iconoLuego', '1'); } catch (e) {} if (aviso) aviso.remove(); aviso = null; }
    function mostrar(cuerpo, botones) {
      if (aviso || !document.body) return;
      aviso = document.createElement('div'); aviso.setAttribute('style', css);
      aviso.innerHTML = '<div style="' + caja + '"><div style="display:flex;gap:14px;align-items:center;margin-bottom:12px">' +
        '<img src="icono-192.png?v=' + ICONO + '" alt="" style="width:58px;height:58px;border-radius:14px;flex:none">' +
        '<div><div style="font-size:18px;font-weight:800">Ícono nuevo: ' + NOMBRE + '</div><div style="font-size:13px;color:#a3aab6;margin-top:2px">El teléfono no lo cambia solo</div></div></div>' +
        '<div style="font-size:14.5px;line-height:1.55;color:#d6dae1">' + cuerpo + '</div>' + botones + '</div>';
      document.body.appendChild(aviso);
      aviso.querySelectorAll('[data-a]').forEach(function (b) { b.onclick = function () { acc(b.dataset.a, b); }; });
    }
    var bip = null;
    function acc(a, b) {
      if (a === 'listo') cerrar(true);
      else if (a === 'luego') cerrar(false);
      else if (a === 'copiar') { try { navigator.clipboard.writeText(link); b.textContent = '✓ Link copiado'; } catch (e) { prompt('Copiá este link:', link); } }
      else if (a === 'chrome') location.href = 'intent://' + link.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
      else if (a === 'instalar' && bip) { bip.prompt(); bip.userChoice.then(function (r) { if (r.outcome === 'accepted') cerrar(true); }); }
    }
    var B1 = '<button data-a="listo" style="' + btn + 'background:#e11d48;color:#fff">Ya lo cambié</button>';
    var B2 = '<button data-a="luego" style="' + btn + 'background:transparent;color:#a3aab6;margin-top:4px">Más tarde</button>';
    var Bc = '<button data-a="copiar" style="' + btn + 'background:#232831;color:#fff">Copiar el link</button>';
    var nota = CODIGO ? '<div style="font-size:12.5px;color:#a3aab6;margin-top:8px">Tené a mano tu código personal: al agregarla de nuevo te lo va a pedir.</div>' : '';
    // En el navegador (ya sacaron el ícono viejo): botón para instalar con un toque
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault(); bip = e;
      if (inst || ls('iconoVisto') === ICONO && ls('iconoInst') === '1') return;
      if (ls('iconoQuito') !== '1') return;
      mostrar('Tocá el botón y aceptá: queda en tu pantalla de inicio con el ícono nuevo.',
        '<button data-a="instalar" style="' + btn + 'background:#e11d48;color:#fff">Instalar ' + NOMBRE + '</button>' + B2);
    });
    window.addEventListener('appinstalled', function () { ls('iconoInst', '1'); cerrar(true); });
    setTimeout(function () {
      if (!inst || apk || ls('iconoVisto') === ICONO) return;
      try { if (sessionStorage.getItem('iconoLuego')) return; } catch (e) {}
      if (ios) mostrar('<b>1.</b> En la pantalla de inicio, mantené apretado el ícono viejo y tocá <b>Eliminar app</b> (no se borra nada, es solo el acceso).<br>' +
          '<b>2.</b> Abrí en <b>Safari</b> este link (copialo con el botón).<br><b>3.</b> Tocá compartir <span style="font-size:17px">⎋</span> y <b>Agregar a inicio</b>.' + nota, Bc + B1 + B2);
      else if (andr) { ls('iconoQuito', '1');
        mostrar('<b>1.</b> En la pantalla de inicio, mantené apretado el ícono viejo y tocá <b>Quitar</b> o <b>Desinstalar</b> (no se borra nada).<br>' +
          '<b>2.</b> Tocá <b>Abrir en Chrome</b> acá abajo.<br><b>3.</b> Te va a aparecer el botón <b>Instalar ' + NOMBRE + '</b>.',
          '<button data-a="chrome" style="' + btn + 'background:#e11d48;color:#fff">Abrir en Chrome</button>' + B1.replace('#e11d48;color:#fff', '#232831;color:#fff') + B2); }
      else ls('iconoVisto', ICONO);   // PC: se actualiza sola
    }, 2500);
  })();
}

function mostrar(html, cfg) {
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', function () { mostrar(html, cfg); }); return; }
  var h0 = 5381; for (var i = 0; i < html.length; i++) h0 = ((h0 << 5) + h0 + html.charCodeAt(i)) | 0;   // huella de esta versión (igual que huella() en puente)
  var ver = String(h0) + ':' + html.length;
  var extra = '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">' +
    '<meta name="theme-color" content="#0e1014"><link rel="manifest" href="manifest.webmanifest?v=6">' +
    '<link rel="apple-touch-icon" href="icono-180.png?v=6"><link rel="icon" type="image/png" href="favicon.png?v=6">' +
    '<title>CeroKm</title><script>window.__API=' + JSON.stringify(cfg) + ';window.__VER=' + JSON.stringify(ver) + ';window.__WRAP=' + JSON.stringify(WRAP_VER) + ';(' + puente.toString() + ')();<\/script>';
  html = html.replace(/<base[^>]*>/i, '').replace(/<head>/i, '<head>' + extra);
  document.open(); document.write(html); document.close();
}

function arrancar(cfg) {
  var guardada = leer('appHtml');
  if (guardada) { mostrar(guardada, cfg); return; }
  fetch('https://script.google.com/macros/s/' + cfg.u + '/exec', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: '_html', args: [] }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.e); guardar('appHtml', j.r); guardar('iconoVisto', '6'); mostrar(j.r, cfg); })
    .catch(function () { formulario('No se pudo conectar. Revisá internet o el código.'); });
}

function formulario(msg) {
  document.body.classList.add('form');
  document.getElementById('cargando').style.display = 'none';
  document.getElementById('form').style.display = 'block';
  document.getElementById('err').textContent = msg || '';
}
// Código personal corto: lo canjea por la clave del aparato (5 intentos fallidos = 30 minutos bloqueado)
function entrarConPin(pin) {
  var b = document.getElementById('entrar'); b.disabled = true; b.textContent = 'Entrando…'; document.getElementById('err').textContent = '';
  fetch('https://script.google.com/macros/s/' + API_ID + '/exec', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: '_pin', args: [pin] }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.e); var c = { u: API_ID, k: j.r }; guardar('cfgApi', JSON.stringify(c));
      document.getElementById('form').style.display = 'none'; document.getElementById('cargando').style.display = 'block'; arrancar(c); })
    .catch(function (e) { b.disabled = false; b.textContent = 'Entrar'; document.getElementById('err').textContent = (e && e.message) || 'No se pudo conectar.'; });
}
document.getElementById('cod').addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('entrar').click(); });
document.getElementById('entrar').onclick = function () {
  var txt = document.getElementById('cod').value.trim(), cfg = parsear(txt);
  if (!cfg && /^[A-Za-z0-9]{4,20}$/.test(txt)) { entrarConPin(txt); return; }
  if (!cfg) { document.getElementById('err').textContent = 'Ese código no parece correcto.'; return; }
  guardar('cfgApi', JSON.stringify(cfg));
  document.getElementById('form').style.display = 'none'; document.getElementById('cargando').style.display = 'block';
  arrancar(cfg);
};

// Si se abrió el link del mail (#c=...), guarda el código en este aparato
var cfg = parsear(location.hash.indexOf('#c=') === 0 ? location.hash : '');
if (cfg) { guardar('cfgApi', JSON.stringify(cfg)); history.replaceState(null, '', location.pathname); }
else { try { cfg = JSON.parse(leer('cfgApi') || 'null'); } catch (e) { cfg = null; } }
if (/[?&]u=\d/.test(location.search)) history.replaceState(null, '', location.pathname + (location.search.indexOf('abrir') >= 0 ? '?abrir=1' : ''));
if (cfg) arrancar(cfg); else formulario();
</script>
</body>
</html>
