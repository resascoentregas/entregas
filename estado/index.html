<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estado de autos</title>
<!-- Ícono para la pantalla de inicio (iPhone y Android) -->
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1KREbmeflchSKmfAKPHcVAaz0-etsHKaa">
<link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1KREbmeflchSKmfAKPHcVAaz0-etsHKaa">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estado autos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111418">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
         background: #111418; color: #eef0f3; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; text-align: center; }
  .caja { max-width: 380px; width: 100%; }
  img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  h1 { font-size: 22px; margin: 18px 0 6px; }
  p { color: #9aa1ad; font-size: 14.5px; line-height: 1.5; margin: 6px 0; }
  a.boton { display: block; margin: 22px 0 18px; padding: 15px; border-radius: 14px; background: #c8102e; color: #fff;
            font-weight: 700; font-size: 17px; text-decoration: none; }
  .pasos { text-align: left; background: #1a1d23; border: 1px solid #2a2e36; border-radius: 14px; padding: 12px 16px; font-size: 14px; line-height: 1.6; }
  .pasos b { color: #fff; }
</style>
</head>
<body>
<div class="caja">
  <img src="https://lh3.googleusercontent.com/d/1KREbmeflchSKmfAKPHcVAaz0-etsHKaa" alt="Ícono de Entregas">
  <h1>Estado de los autos · Jeep RAM</h1>
  <p id="estado">Abriendo la app…</p>
  <a class="boton" id="abrir" href="#">Abrir la app</a>
  <div class="pasos" id="pasos">
    <b>Para tenerla en el inicio con este ícono:</b><br>
    📱 <b>Android (Chrome):</b> menú ⋮ → <b>Agregar a pantalla principal</b> (o "Instalar app").<br>
    🍎 <b>iPhone (Safari):</b> botón compartir ⬆️ → <b>Agregar a inicio</b>.
  </div>
</div>
<script>
  // Link compartido (solo lectura). Si un día cambia, solo hay que cambiarlo acá.
  var APP = 'https://script.google.com/macros/s/AKfycbxLhhRuioH2srNX46XuOuEUUX4-hFNZ5iaZ33VEFnspKds7CZW_hPxdVH2LlVML0T5UPQ/exec';
  var esPC = window.innerWidth >= 1000 && !/Android|iPhone|iPad/i.test(navigator.userAgent);
  var destino = APP + '?vista=' + (esPC ? 'pc' : 'cel');
  document.getElementById('abrir').href = destino;
  // Si se abrió desde el ícono del inicio, entra directo a la app
  var desdeInicio = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true ||
                    /[?&]abrir=1/.test(location.search);
  if (desdeInicio) { location.replace(destino); }
  else { document.getElementById('estado').textContent = 'Agregá esta página a la pantalla de inicio de tu celular.'; }
</script>
</body>
</html>
