<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>CeroKm Estados</title>
<link rel="apple-touch-icon" href="icono-180.png?v=5">
<link rel="icon" type="image/png" href="favicon.png?v=5">
<link rel="manifest" href="manifest.webmanifest?v=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CeroKm Estados">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1014">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
         background: #0e1014; color: #eceef2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; text-align: center; }
  .caja { max-width: 360px; width: 100%; }
  .logo { width: min(230px, 62vw); margin: 0 auto; filter: drop-shadow(0 6px 26px rgba(225,29,72,.55)); }
  .logo img { display: block; height: auto; margin: 0 auto; }
  .logo .jr { width: 100%; margin-bottom: 9%; animation: pop .55s cubic-bezier(.2,1.5,.35,1) both; }
  .logo .rs { width: 90.7%; animation: entra .45s cubic-bezier(.2,.9,.3,1) .42s both; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.4) rotate(-12deg); } 70% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes entra { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes latido { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  h1 { font-size: 20px; margin: 18px 0 6px; }
  p { color: #8b93a1; font-size: 14px; line-height: 1.5; }
  .barra { width: 120px; height: 3px; border-radius: 3px; background: #262b34; margin: 22px auto 0; overflow: hidden; }
  .barra::after { content: ""; display: block; width: 40%; height: 100%; background: #e11d48; border-radius: 3px; animation: va 1s ease-in-out infinite; }
  @keyframes va { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  button { margin-top: 16px; padding: 12px 20px; border-radius: 12px; border: 0; background: #e11d48; color: #fff; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
<div class="caja">
  <div class="logo"><img class="jr" src="../jeepram.png" alt="Jeep RAM"><img class="rs" src="../resasco_txt.png" alt="Resasco"></div>
  <h1>Estado de los autos · Jeep RAM</h1>
  <div id="cargando"><div class="barra"></div></div>
  <div id="error" style="display:none"><p>No se pudo cargar. Revisá internet.</p><button onclick="location.reload()">Reintentar</button></div>
</div>
<script>
/* Link para compartir (solo ver). Muestra la pantalla de la app sin pasar por la página de Google,
   así no aparece el cartel "Un usuario de Google Apps Script creó esta aplicación". */
var WRAP_VER = '3';
var API = 'https://script.google.com/macros/s/AKfycbwMccMP6rNIBN-iutoZVSfVqYasFBMve_L3eUG1JDRx5FhUtV1idSD72ImTmHms3ooa2w/exec';
var LG = Storage.prototype.getItem, LS = Storage.prototype.setItem;   // originales (la pantalla después usa memoria aparte)
function leer(k) { try { return LG.call(localStorage, k); } catch (e) { return null; } }
function guardar(k, v) { try { LS.call(localStorage, k, v); } catch (e) {} }
function pedir(fn, args) {
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }) })
    .then(function (r) { return r.json(); }).then(function (j) { if (!j.ok) throw new Error(j.e); return j.r; });
}

// Lo que corre dentro de la pantalla: solo puede leer el estado; lo demás no hace nada
function puente() {
  var API = window.__API;
  // Memoria aparte (prefijo est_): si se abre en el celular del dueño, no pisa los datos guardados de su app
  var s = Storage.prototype.setItem;
  try { var P = Storage.prototype, g = P.getItem, r = P.removeItem; s = P.setItem;
    P.getItem = function (k) { return g.call(this, 'est_' + k); };
    P.setItem = function (k, v) { return s.call(this, 'est_' + k, v); };
    P.removeItem = function (k) { return r.call(this, 'est_' + k); }; } catch (e) {}
  function corredor(ok, mal) {
    return new Proxy({}, { get: function (_, fn) {
      if (fn === 'withSuccessHandler') return function (f) { return corredor(f, mal); };
      if (fn === 'withFailureHandler') return function (f) { return corredor(ok, f); };
      if (fn === 'withUserObject') return function () { return corredor(ok, mal); };
      return function () {
        if (fn !== 'getInicio' && fn !== 'getDatos') return;   // solo ver: nada se cambia
        fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                     body: JSON.stringify({ fn: '_estado', args: [arguments[0] || ''] }) })
          .then(function (r) { return r.json(); })
          .then(function (j) { if (!j.ok) throw new Error(j.e); if (ok) ok(j.r); })
          .catch(function (e) { if (mal) mal(e.message ? e : new Error('Sin conexión')); });
      };
    } });
  }
  window.google = { script: { run: corredor(), host: { close: function () {} },
    url: { getLocation: function (cb) { cb({ parameter: { ver: '1' }, parameters: {}, hash: '' }); } } } };
  function huella(x) { var h = 5381; for (var i = 0; i < x.length; i++) h = ((h << 5) + h + x.charCodeAt(i)) | 0; return String(h) + ':' + x.length; }
  var ultima = 0;
  // Versión nueva: tapa toda la pantalla y no deja seguir hasta tocar "Actualizar ahora"
  function bloquear() {
    if (document.getElementById('__upd') || !document.body) return;
    var o = document.createElement('div'); o.id = '__upd';
    o.setAttribute('style', 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;' +
      'background:rgba(10,12,16,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-family:-apple-system,system-ui,sans-serif;' +
      'opacity:0;transition:opacity .3s');
    o.innerHTML = '<div style="max-width:340px;width:100%;text-align:center;color:#fff;background:#14171c;border:1px solid rgba(225,29,72,.5);' +
      'border-radius:24px;padding:28px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5)">' +
      '<div style="font-size:44px;line-height:1">✨</div>' +
      '<div style="font-size:20px;font-weight:800;margin:12px 0 6px">Hay una versión nueva</div>' +
      '<div style="font-size:14.5px;color:#a3aab6;line-height:1.5">Para seguir usando la app tenés que actualizar. Tarda unos segundos.</div>' +
      '<button style="display:block;width:100%;margin-top:20px;padding:15px;border:0;border-radius:16px;background:#e11d48;color:#fff;' +
      'font:800 16px -apple-system,system-ui,sans-serif;cursor:pointer">Actualizar ahora</button></div>';
    o.querySelector('button').onclick = function () {
      this.textContent = 'Actualizando…'; this.disabled = true;
      location.replace(location.pathname + '?' + (location.search.indexOf('abrir') >= 0 ? 'abrir=1&' : '') + 'u=' + Date.now());
    };
    document.body.appendChild(o);
    requestAnimationFrame(function () { o.style.opacity = '1'; });
    try { document.activeElement && document.activeElement.blur(); } catch (e) {}
  }
  // ¿Cambió esta página de GitHub? (WRAP_VER es el número de versión escrito en la página)
  function paginaNueva() {
    return fetch(location.pathname + '?nv=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); })
      .then(function (t) { var m = t.match(/var WRAP_VER = '([^']+)'/); if (!m || !window.__WRAP || m[1] === window.__WRAP) return false;
        try { if (sessionStorage.getItem('updWrap') === m[1]) return false; sessionStorage.setItem('updWrap', m[1]); } catch (e) {}   // si ya se intentó, no trabo de nuevo
        return true; }, function () { return false; });
  }
  function revisar() {
    if (Date.now() - ultima < 30000) return; ultima = Date.now();
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: '_html', args: [] }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok || !j.r) return; try { s.call(localStorage, 'estadoHtml', j.r); } catch (e) {}
        if (window.__VER && huella(j.r) !== window.__VER) { var hv = huella(j.r); try { if (sessionStorage.getItem('updHtml') === hv) return; sessionStorage.setItem('updHtml', hv); } catch (e) {} bloquear(); } }, function () {});
    paginaNueva().then(function (n) { if (n) bloquear(); });
  }
  setTimeout(revisar, 3000);
  setInterval(revisar, 5 * 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) revisar(); });
}

function huellaTop(x) { var h = 5381; for (var i = 0; i < x.length; i++) h = ((h << 5) + h + x.charCodeAt(i)) | 0; return String(h) + ':' + x.length; }
function mostrar(html) {
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', function () { mostrar(html); }); return; }
  var extra = '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">' +
    '<meta name="theme-color" content="#0e1014"><link rel="manifest" href="manifest.webmanifest?v=5">' +
    '<link rel="apple-touch-icon" href="icono-180.png?v=5"><link rel="icon" type="image/png" href="favicon.png?v=5">' +
    '<title>CeroKm Estados</title><script>window.__API=' + JSON.stringify(API) + ';window.__VER=' + JSON.stringify(huellaTop(html)) + ';window.__WRAP=' + JSON.stringify(WRAP_VER) + ';(' + puente.toString() + ')();<\/script>';
  html = html.replace(/<base[^>]*>/i, '').replace(/<head>/i, '<head>' + extra);
  document.open(); document.write(html); document.close();
}

if (/[?&]u=\d/.test(location.search)) history.replaceState(null, '', location.pathname);
var guardada = leer('estadoHtml');
if (guardada) {
  mostrar(guardada);
} else {
  pedir('_html').then(function (h) { guardar('estadoHtml', h); mostrar(h); }, function () {
    document.getElementById('cargando').style.display = 'none'; document.getElementById('error').style.display = 'block';
  });
}
</script>
</body>
</html>
